    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('.hero__header');
            
            // Handle sticky header scroll effects
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            const registerBtn = document.querySelector('.hero__register-btn');
            if (registerBtn) {
                registerBtn.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevents the browser from jumping down to the anchor ID
                    registerBtn.classList.toggle('clicked');
                });
            }

            const submitBtn = document.querySelector('.hero__submit-btn');
            if (submitBtn) {
                submitBtn.addEventListener('click', (e) => {
                    e.preventDefault(); // Optional depending on form logic, but good for demo
                    submitBtn.classList.toggle('clicked');
                });
            }
        });
    </script>
