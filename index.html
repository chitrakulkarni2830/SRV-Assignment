<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Premier Schools Exhibition</title>

<link rel="stylesheet" href="./css/reset.css" />
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to content</a>

    <main id="main-content">



        <section class="hero">


            <header class="hero__header">

                <a href="/" class="hero__logo" aria-label="Premier Schools Exhibition Home">
                    <img
                        src="./assets/logo.png"
                        alt="Premier Schools Exhibition Logo"
                        class="hero__logo-image"
                    >

                </a>

                <a href="#enquiry-form" class="hero__register-btn">

                    <span class="hero__register-btn-icon">
                        

                    </span>

                    <span class="hero__register-btn-text">
                            REGISTER NOW
                    </span>

                </a>

            </header>
           
        </section>
    


        <section class = "Event Introduction">
            <strong>Apparel House,</strong>

            <span>Sec 44, Gurugram</span>

            </div>

            <div class="hero__event-divider"></div>

            <div class="hero__event-date">

            <strong>2–3 August 2025</strong>

            <span>Sat–Sun | 10AM – 6PM</span>

            </div>

            </div>
        </div>


<div class="hero__gallery" aria-hidden="true">

    <!-- Left Column -->
    <div class="hero__gallery-column hero__gallery-column--left">

        <div class="hero__gallery-item">
            <img src="./assets/classroom.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/piano.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/smiling.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/student1.png" alt="" class="hero__gallery-image">
        </div>

    </div>

    <!-- Middle Column -->
    <div class="hero__gallery-column hero__gallery-column--middle">

        <div class="hero__gallery-item">
            <img src="./assets/fun.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/school.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/girl.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/playing.png" alt="" class="hero__gallery-image">
        </div>

    </div>

    <!-- Right Column -->
    <div class="hero__gallery-column hero__gallery-column--right">

        <div class="hero__gallery-item">
            <img src="./assets/studying.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/painting.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/cycling.png" alt="" class="hero__gallery-image">
        </div>

        <div class="hero__gallery-item">
            <img src="./assets/reading.png" alt="" class="hero__gallery-image">
        </div>

    </div>

</div>


<aside class="hero__form" id="enquiry-form">

    <form class="hero__form-container">

        <h2 class="hero__form-title">
            Enquire Now
        </h2>

        <label class="sr-only" for="parent-name">
            Parent's Name
        </label>

        <input
            id="parent-name"
            class="hero__form-input"
            type="text"
            placeholder="Parent's Name"
            required
        >

        <label class="sr-only" for="phone-number">
            Phone Number
        </label>

        <input
            id="phone-number"
            class="hero__form-input"
            type="tel"
            placeholder="Phone Number"
            required
        >

        <label class="sr-only" for="grade">
            Which grade are you looking for?
        </label>

        <textarea
            id="grade"
            class="hero__form-input hero__form-textarea"
            rows="4"
            placeholder="Which grade are you looking for?"
            required
        ></textarea>

        <button class="hero__submit-btn" type="submit">

            <span class="hero__submit-btn-icon">
                ↗
            </span>

            <span class="hero__submit-btn-text">
                SUBMIT
            </span>

        </button>

    </form>

</aside>
        </section>
     </main>

</body>
</html>
